<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Detalhe da tarefa - Almoxarifado</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app-header"></div>
    <main id="conteudo" class="app-main" tabindex="-1">
      <div class="screen-toolbar page-heading">
        <a class="page-back" href="/pages/tarefas.html"><span class="icon icon-chevron-left" aria-hidden="true"></span></a>
        <h2 id="detTitulo">Detalhe da tarefa</h2>
      </div>
      <p id="detFeedback" class="feedback" aria-live="polite"></p>
      <section class="screen-card stack" id="detalhe" aria-labelledby="detTitulo"></section>
      <div class="form-actions detail-actions">
        <a class="btn btn-danger" href="/pages/tarefas.html">Cancelar</a>
        <button class="btn btn-primary" type="submit" form="taskChangesForm">Confirmar</button>
      </div>
    </main>

    <script src="/config.js"></script>
    <script src="/js/core/state.js"></script>
    <script src="/js/core/session.js"></script>
    <script src="/js/core/preferences.js"></script>
    <script src="/js/core/ui.js"></script>
    <script src="/js/core/header.js"></script>
    <script src="/js/core/app.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/dtos/dtos.js"></script>
    <script src="/js/services/services.js"></script>
    <script src="/js/pages/tarefa.js"></script>
  </body>
</html>
