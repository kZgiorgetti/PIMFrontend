<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Colaboradores - Almoxarifado</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app-header"></div>
    <main id="conteudo" class="app-main" tabindex="-1">
      <section class="screen-card" aria-labelledby="tituloColab">
        <div class="screen-toolbar"><h2 id="tituloColab">Colaboradores</h2>
          <button class="btn btn-primary" id="abrirModalColab" type="button">Novo colaborador</button></div>
        <p id="colabFeedback" class="feedback" aria-live="polite"></p>
        <div class="table-wrap" id="colabLista"></div>
      </section>
    </main>
    <div class="modal-overlay hidden" id="colabModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="colabModalTitulo">
        <button class="modal-close" type="button" data-fechar aria-label="Fechar janela">&times;</button>
        <h2 class="modal-title" id="colabModalTitulo">Novo colaborador</h2>
        <form id="colabForm" class="form">
          <input type="hidden" id="colabId" />
          <p id="colabFormErro" class="feedback" role="alert"></p>
          <div class="form-group"><label for="colabNome">Nome</label><input type="text" id="colabNome" maxlength="150" required /></div>
          <div class="form-group"><label for="colabEmail">E-mail (opcional)</label><input type="email" id="colabEmail" maxlength="200" /></div>
          <div class="form-group"><label for="colabCargo">Cargo (opcional)</label><input type="text" id="colabCargo" maxlength="100" /></div>
          <div class="form-actions"><button class="btn btn-danger" type="button" data-fechar>Cancelar</button><button class="btn btn-primary" type="submit">Salvar</button></div>
        </form>
      </div>
    </div>
    <script src="/config.js"></script>
    <script src="/js/core/state.js"></script>
    <script src="/js/core/session.js"></script>
    <script src="/js/core/preferences.js"></script>
    <script src="/js/core/ui.js"></script>
    <script src="/js/core/header.js"></script>
    <script src="/js/core/app.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/dtos/dtos.js"></script>
    <script src="/js/services/services.js"></script>
    <script src="/js/pages/colaboradores.js"></script>
  </body>
</html>
